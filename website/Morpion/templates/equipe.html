{% extends "base.html" %}
{% block main_block %}

<div class="create_eq">
    <a href="creer_equipe">Creer une Nouvelle Equipe</a>
</div>

<div class="equipe_list">
    <ol>
        {% for inst in REQUEST_VARS['equipes'] %}
        <li>
            <div class="flag" style="--flag-color: {{ inst[2] }};"></div>
            <strong>
                <a href="/equipe_detail?id={{ inst[0] }}">{{ inst[1] }}</a>
            </strong>
            <div class="delete_eq"> 
               <form method="GET" onsubmit="return confirm('Supprimer cette équipe ?');" class="delete-form">
                    <input type="hidden" name="id" value="{{ inst[0] }}">
                    <button type="submit" name="delete" class="delete_btn">🗑️</button>
                    
                    {% if REQUEST_VARS['delete'] %}
                        <meta http-equiv="refresh" content="0; url={{ REQUEST_VARS['delete'] }}">
                    {% endif %}

                </form>
            </div>
        </li>
        {% endfor %}
    </ol>
</div>
{% endblock %}
