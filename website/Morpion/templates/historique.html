{% extends "base.html" %}
{% block main_block %}
    <h3> Historique des jeu: </h3><br>
    <div class="hist_section">
        <ul>
            {% for t in REQUEST_VARS['historique'] %}
              <li class="hist_item">
                <span style="{% if t[0] == t[2] %}color: green; font-weight: bold;{% endif %}">
                    {{ t[0] }}
                </span>
                vs
                <span style="{% if t[1] == t[2] %}color: green; font-weight: bold;{% endif %}">
                    {{ t[1] }}
                </span>
            </li>  
            {% endfor %}
        </ul>
    </div>
{% endblock %}
